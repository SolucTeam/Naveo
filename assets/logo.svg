<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D232B"/>
      <stop offset="1" stop-color="#10141A"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0B8A61"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#046C4E"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond arrondi façon app icon -->
  <rect x="64" y="64" width="896" height="896" rx="192" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="192" fill="none"
        stroke="#2C333B" stroke-width="4"/>

  <!-- Conteneur isométrique -->
  <g filter="url(#glow)">
    <!-- face gauche -->
    <polygon points="312,415 512,530 512,770 312,655" fill="url(#left)"/>
    <!-- face droite -->
    <polygon points="712,415 512,530 512,770 712,655" fill="url(#right)"/>
    <!-- face du dessus -->
    <polygon points="512,300 712,415 512,530 312,415" fill="url(#top)"/>
    <!-- lignes de séparation (portes du conteneur) -->
    <line x1="379" y1="453" x2="579" y2="568" stroke="#0B3D2E" stroke-width="10" opacity="0.35"/>
    <line x1="446" y1="492" x2="646" y2="607" stroke="#0B3D2E" stroke-width="10" opacity="0.35"/>
    <line x1="645" y1="453" x2="445" y2="568" stroke="#0B3D2E" stroke-width="10" opacity="0.35"/>
    <line x1="578" y1="492" x2="378" y2="607" stroke="#0B3D2E" stroke-width="10" opacity="0.35"/>
  </g>

  <!-- Prompt terminal -->
  <g stroke="#F1F5F9" stroke-width="30" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <polyline points="430,565 486,620 430,675"/>
    <line x1="512" y1="675" x2="600" y2="675"/>
  </g>
</svg>
